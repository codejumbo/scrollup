name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Ruby (for Kamal)
        uses: ruby/setup-ruby@3ff19f5e2baf30647122352b96108b1fbe250c64  # v1.299.0
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/kamal_ed25519
          chmod 600 ~/.ssh/kamal_ed25519
          ssh-keyscan -H 5.161.88.56 >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Create Kamal secrets
        run: |
          mkdir -p .kamal
          cat > .kamal/secrets << EOF
          KAMAL_REGISTRY_USERNAME=${{ github.actor }}
          KAMAL_REGISTRY_PASSWORD=${{ secrets.GITHUB_TOKEN }}
          EOF
          sed -i 's/^[[:space:]]*//' .kamal/secrets

      - name: Deploy
        run: bundle exec kamal deploy --skip-hooks

      - name: Prune old images on server
        run: |
          ssh -i ~/.ssh/kamal_ed25519 -o StrictHostKeyChecking=no root@5.161.88.56 \
            "docker images --format '{{.Repository}}:{{.Tag}}' | grep 'ghcr.io/codejumbo/scrollup' | tail -n +4 | xargs -r docker rmi -f; docker image prune -f"
